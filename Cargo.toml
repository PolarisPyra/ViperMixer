[package]
name = "viper-mixer"
version = "26.11.1"
edition = "2024"
description = "A MIDI fader controller for PipeWire by Viper"
license = "MIT"

[dependencies]
# Zed's GPU UI framework draws the window.
gpui = "0.2.2"
# The tray, over D-Bus, without a GTK main loop. `async-io` is the runtime GPUI already uses.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
midir = "0.10"
# These are already in GPUI's dependency tree, so they add nothing to the build.
futures = "0.3"
png = "0.18"
serde_json = "1"
