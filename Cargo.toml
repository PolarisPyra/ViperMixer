[package]
name = "viper-midi-mixer"
version = "0.5.2"
edition = "2021"
description = "A MIDI fader controller for PipeWire by Viper"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
midir = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
single-instance = "0.3.3"
thiserror = "2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", features = ["blocking"] }

[profile.release]
lto = "thin"
codegen-units = 1
