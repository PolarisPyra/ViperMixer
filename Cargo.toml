[package]
name = "viper-midi-mixer"
version = "0.2.0"
edition = "2021"
description = "A MIDI fader controller for PipeWire by Viper"

[dependencies]
eframe = "0.31"
gtk = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }
midir = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tray-icon = { version = "0.24.2", default-features = false, features = ["gtk"] }

[profile.release]
lto = "thin"
codegen-units = 1
